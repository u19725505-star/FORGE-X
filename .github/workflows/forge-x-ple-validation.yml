name: FORGE-X PLE Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: forge-x-ple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-ple-validation:
    name: Docker-capable PLE validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out FORGE-X repository
        uses: actions/checkout@v4

      - name: Check out pinned official PLE repository
        uses: actions/checkout@v4
        with:
          repository: google-research/ple
          ref: 8320f0402fdca9f42476607f72bcfd5271cd50c9
          path: official-ple
          persist-credentials: false

      - name: Verify official PLE commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="8320f0402fdca9f42476607f72bcfd5271cd50c9"
          ACTUAL="$(git -C official-ple rev-parse HEAD)"
          echo "Expected: ${EXPECTED}"
          echo "Actual:   ${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify Docker availability
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Install official PLE dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f official-ple/uv.lock ]; then
            uv sync --project official-ple --frozen
          elif [ -f official-ple/pyproject.toml ]; then
            uv sync --project official-ple
          else
            echo "Official PLE project metadata was not found."
            exit 1
          fi

      - name: Verify submission files and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          test -f submission/submission.yaml
          test -f submission/serve.py
          test -f submission/forge_x_runtime.py
          test -f submission/forge_x_agent.py
          python -m compileall -q submission
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("submission/serve.py").read_text(encoding="utf-8"))
          wrapper_lines = [
              node.lineno for node in tree.body
              if isinstance(node, ast.AsyncFunctionDef) and node.name == "run_tool"
          ]
          main_lines = [
              node.lineno for node in tree.body
              if isinstance(node, ast.If)
              and isinstance(node.test, ast.Compare)
              and isinstance(node.test.left, ast.Name)
              and node.test.left.id == "__name__"
              and any(
                  isinstance(op, ast.Eq)
                  and isinstance(comparator, ast.Constant)
                  and comparator.value == "__main__"
                  for op, comparator in zip(node.test.ops, node.test.comparators)
              )
          ]
          assert len(wrapper_lines) >= 2, wrapper_lines
          assert main_lines and main_lines[-1] > wrapper_lines[-1], {
              "run_tool_definitions": wrapper_lines,
              "main_guard": main_lines,
          }
          print("PASS: FORGE-X tool mediation is defined before server startup")
          PY

      - name: Smoke-test FORGE-X local engineering tool integration
        shell: bash
        env:
          MODEL_NAME: google-cloud/gemini-3.8-flash
          # The smoke test exercises deterministic local tools only; no model request is made.
          OPENAI_API_KEY: forge-x-ci-no-network-call
          PYTHONPATH: submission
          FORGE_X_STATE_DIR: /tmp/forge-x-smoke-state
        run: |
          set -euo pipefail
          uv run --project official-ple --with openai==3.26.1 --with websockets==15.0.1 python - <<'PY'
          import asyncio
          import json
          from pathlib import Path
          import serve

          call = {
              "name": "forge_x_calculate",
              "arguments": json.dumps({
                  "discipline": "mechanical",
                  "method": "kinetic_energy",
                  "inputs": {"mass": 2, "velocity": 3}
              })
          }
          raw = asyncio.run(serve.run_tool(None, call))
          assert isinstance(raw, str), f"Tool result must be text, got {type(raw).__name__}"
          result = json.loads(raw)
          assert result["result"] == 9.0, result
          assert result["verification_status"] == "NUMERICALLY_CONSISTENT", result
          assert result["engineering_status"] == "UNRESOLVED", result

          events = Path("/tmp/forge-x-smoke-state/events.jsonl")
          assert events.is_file(), "FORGE-X did not persist tool observation events"
          event_text = events.read_text(encoding="utf-8")
          assert "OFFICIAL_TOOL_RESULT" in event_text, "Tool observation was not recorded"
          print("PASS: local tool returns the official PLE string content contract")
          print("PASS: deterministic result and independent numerical check")
          print("PASS: observation event persisted")
          print("PASS: engineering signoff remains unresolved")
          PY

      - name: End-to-end offline FORGE-X task-loop test
        shell: bash
        env:
          MODEL_NAME: google-cloud/gemini-3.8-flash
          OPENAI_API_KEY: forge-x-ci-no-network-call
          PYTHONPATH: submission
          FORGE_X_STATE_DIR: /tmp/forge-x-loop-state
        run: |
          set -euo pipefail
          uv run --project official-ple --with openai==3.26.1 --with websockets==15.0.1 python - <<'PY'
          import asyncio
          import json
          from pathlib import Path
          from types import SimpleNamespace
          import serve

          class FakeMessage:
              def __init__(self, content=None, tool_calls=None):
                  self.content = content
                  self.tool_calls = tool_calls
              def model_dump(self, exclude_none=True):
                  data = {"role": "assistant", "content": self.content}
                  if self.tool_calls is not None:
                      data["tool_calls"] = self.tool_calls
                  return {k: v for k, v in data.items() if v is not None}

          class FakeSession:
              workdir = "/tmp/forge-x-offline-task"
              instruction = "Calculate the kinetic energy of a 2 kg object moving at 3 m/s."
              final_message = None
              def time_left(self):
                  return None
              async def log(self, message):
                  pass
              async def usage(self, *args):
                  pass

          calls = []
          async def fake_create(**kwargs):
              calls.append(kwargs)
              if len(calls) == 1:
                  return SimpleNamespace(
                      usage=None,
                      choices=[SimpleNamespace(
                          message=FakeMessage(tool_calls=[{
                              "id": "call_forge_x_1",
                              "type": "function",
                              "function": {
                                  "name": "forge_x_calculate",
                                  "arguments": json.dumps({
                                      "discipline": "mechanical",
                                      "method": "kinetic_energy",
                                      "inputs": {"mass": 2, "velocity": 3}
                                  })
                              }
                          }]),
                          finish_reason="tool_calls"
                      )]
                  )

              messages = kwargs["messages"]
              tool_messages = [m for m in messages if m.get("role") == "tool"]
              assert len(tool_messages) == 1, messages
              tool_result = json.loads(tool_messages[0]["content"])
              assert tool_result["result"] == 9.0, tool_result
              assert tool_result["verification_status"] == "NUMERICALLY_CONSISTENT"
              assert tool_result["engineering_status"] == "UNRESOLVED"
              assert any(
                  t.get("function", {}).get("name") == "forge_x_calculate"
                  for t in kwargs["tools"]
              ), "FORGE-X tool was not registered with the model"
              return SimpleNamespace(
                  usage=None,
                  choices=[SimpleNamespace(
                      message=FakeMessage(
                          content="Kinetic energy is 9 J. Numerical verification passed; engineering signoff remains unresolved."
                      ),
                      finish_reason="stop"
                  )]
              )

          serve.client = SimpleNamespace(
              chat=SimpleNamespace(
                  completions=SimpleNamespace(create=fake_create)
              )
          )
          result = asyncio.run(serve.solve(FakeSession()))
          assert "9 J" in result, result
          assert len(calls) == 2, f"Expected tool turn and final turn, got {len(calls)}"
          events = Path("/tmp/forge-x-loop-state/events.jsonl")
          assert events.is_file(), "Task-loop evidence log was not written"
          event_text = events.read_text(encoding="utf-8")
          event_records = [json.loads(line) for line in event_text.splitlines() if line.strip()]
          event_types = {record.get("event_type") for record in event_records}
          assert "OFFICIAL_TOOL_RESULT" in event_types, event_types
          print("PASS: complete solve loop called the model twice")
          print("PASS: engineering tool was registered and invoked")
          print("PASS: tool result returned to the model as a PLE tool message")
          print("PASS: official tool observation was persisted")
          print("PASS: final answer preserved unresolved signoff status")
          PY

      - name: Cross-discipline engineering regression suite
        shell: bash
        env:
          PYTHONPATH: submission
          FORGE_X_STATE_DIR: /tmp/forge-x-regression-state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import forge_x_runtime as runtime
          import forge_x_agent as agent

          cases = [
              ({"discipline":"structural","method":"axial_stress","inputs":{"force":1000,"area":0.01}}, 100000.0),
              ({"discipline":"civil","method":"flow_rate","inputs":{"volume":0.6,"time":2}}, 0.3),
              ({"discipline":"electrical","method":"ohms_law","inputs":{"voltage":12,"resistance":4}}, 3.0),
              ({"discipline":"mechanical","method":"kinetic_energy","inputs":{"mass":2,"velocity":3}}, 9.0),
          ]
          for payload, expected in cases:
              result = runtime.calculate_and_verify(payload)
              assert abs(result["result"] - expected) < 1e-12, result
              assert result["verification_status"] == "NUMERICALLY_CONSISTENT", result
              assert result["engineering_status"] == "UNRESOLVED", result
              assert result["engineering_signoff"] is False, result

          invalid = [
              {"discipline":"structural","method":"axial_stress","inputs":{"force":1,"area":0}},
              {"discipline":"civil","method":"flow_rate","inputs":{"volume":1,"time":0}},
              {"discipline":"electrical","method":"ohms_law","inputs":{"voltage":1,"resistance":0}},
              {"discipline":"mechanical","method":"kinetic_energy","inputs":{"mass":-1,"velocity":2}},
              {"discipline":"mechanical","method":"kinetic_energy","inputs":{"mass":True,"velocity":2}},
              {"discipline":"structural","method":"kinetic_energy","inputs":{"mass":1,"velocity":2}},
              {"discipline":"mechanical","method":"not_a_method","inputs":{}},
          ]
          for payload in invalid:
              try:
                  runtime.calculate_and_verify(payload)
              except (ValueError, TypeError, KeyError):
                  continue
              raise AssertionError(f"Invalid input unexpectedly accepted: {payload}")

          agent_cases = [
              ("structural","axial_stress",{"force":1000,"area":0.01},100000.0),
              ("civil","rectangular_area",{"length":10,"width":4},40.0),
              ("electrical","electrical_power",{"voltage":12,"current":2},24.0),
              ("mechanical","newtons_second_law",{"mass":5,"acceleration":3},15.0),
          ]
          for discipline, method, inputs, expected in agent_cases:
              calculation = agent.calculate(discipline, method, inputs)
              assert abs(calculation["result"] - expected) < 1e-12, calculation
              verification = agent.independently_verify(calculation)
              assert verification["status"] == "PASS", verification

          event_file = Path("/tmp/forge-x-regression-state/events.jsonl")
          records = [json.loads(line) for line in event_file.read_text().splitlines() if line.strip()]
          kinds = {record.get("event_type") for record in records}
          assert "ENGINEERING_CALCULATION" in kinds, kinds
          assert "CALCULATION_VERIFICATION" in kinds, kinds
          print("PASS: exposed tool covers structural, civil, electrical, mechanical calculations")
          print("PASS: independent numerical checks and unresolved signoff safeguards")
          print("PASS: invalid, unsafe, mismatched, and unsupported inputs rejected")
          print("PASS: agent registry independently recomputed one case per discipline")
          print("PASS: calculation and verification audit events persisted")
          PY

      - name: Validate submission with official PLE kit
        shell: bash
        working-directory: official-ple
        run: |
          set -euo pipefail
          uv run --project . python -m kit validate ../submission

      - name: Build submission with official PLE kit
        shell: bash
        working-directory: official-ple
        run: |
          set -euo pipefail
          uv run --project . python -m kit build ../submission

      - name: Validate official artifacts when present
        shell: bash
        working-directory: official-ple
        run: |
          set -euo pipefail
          if [ -d ../submission/artifacts ] && [ -n "$(find ../submission/artifacts -type f -print -quit)" ]; then
            uv run --project . python -m kit artifacts ../submission
          else
            echo "SKIPPED: No evaluator-produced artifacts directory is available."
            echo "Artifact validation requires actual evaluator-produced artifacts."
          fi

      - name: Record validation summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## FORGE-X PLE CI

          - Official PLE commit: `8320f0402fdca9f42476607f72bcfd5271cd50c9`
          - Runner: `ubuntu-latest`
          - Docker availability: checked
          - Local engineering-tool smoke test: attempted
          - Official kit submission validation: attempted
          - Official kit build: attempted
          - Full model/smoke/MCP run: not claimed; requires configured model-proxy credentials
          - Submission: `submission/`

          Passing validation/build does not establish hidden-task performance or leaderboard readiness.
          SUMMARY

      - name: Upload CI logs and submission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-x-ple-ci-${{ github.run_id }}
          path: |
            submission/
            official-ple/kit/
          if-no-files-found: warn
          retention-days: 14
